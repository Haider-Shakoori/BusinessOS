name: Resolve Composer Lock (Batch 25)

on:
  pull_request:
    branches: [main]
    paths:
      - composer.json
      - .github/workflows/batch25-lock-sync.yml

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom
          coverage: none

      - name: Resolve PDF dependency
        run: composer update barryvdh/laravel-dompdf --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Validate resolved lock
        run: |
          composer validate --strict --no-check-publish
          composer audit --no-interaction

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: batch25-composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
